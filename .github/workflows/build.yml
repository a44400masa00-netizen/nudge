name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fetch openWakeWord feature models
        run: |
          d=app/src/main/assets/wakeword
          mkdir -p "$d"
          for f in melspectrogram.onnx embedding_model.onnx; do
            [ -s "$d/$f" ] || curl -fL --retry 3 -o "$d/$f" "https://github.com/dscripka/openWakeWord/releases/download/v0.5.1/$f"
          done
          test -s "$d/hey_daily.onnx" || { echo "::error::$d/hey_daily.onnx がありません"; exit 1; }
          ls -la "$d"

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
